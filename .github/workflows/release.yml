name: Release

on:
  push:
    tags:
      - 'go-cms-v*'

permissions:
  contents: read

env:
  REGISTRY: ccr.ccs.tencentyun.com
  NAMESPACE: ${{ vars.CCR_NAMESPACE || 'pigpig' }}
  IMAGE_NAME: ${{ vars.CCR_IMAGE_NAME || 'go-backend-template' }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    environment: go-cms

    strategy:
      matrix:
        app: [server, worker, cron, migrate]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release commit is on project/go-cms
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/project/go-cms

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}-${{ matrix.app }}
          tags: |
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=raw,value=go-cms

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Tencent CCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CCR_USERNAME }}
          password: ${{ secrets.CCR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP=${{ matrix.app }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    needs: build-and-push
    uses: ./.github/workflows/deploy-production.yml
    with:
      image_tag: ${{ github.ref_name }}
      source_ref: ${{ github.ref }}
    secrets: inherit

