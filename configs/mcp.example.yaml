# Optional MCP client settings. Credentials must be injected as
# CMS_MCP_CLIENT_ID and CMS_MCP_CLIENT_SECRET, never stored in this file.
cms_base_url: https://cms.example.internal
request_timeout_seconds: 10
allow_insecure_http: false
# Required local staging directory for article bodies. Article write tools only
# accept relative content_file paths below this directory. CMS_CONTENT_ROOT
# takes precedence when set.
content_root: /absolute/path/to/cms-content
# Optional Google Search Console integration. Keep credentials outside this
# file; set GSC_SERVICE_ACCOUNT_FILE in the MCP process environment.
gsc_enabled: false
gsc_property: sc-domain:example.com
